name: Helper CI

on:
  push:
    paths:
      - 'helper/**'
      - 'scripts/check_helper_version_sync.sh'
      - 'scripts/check_helper_method_parity.sh'
      - 'HelperSwift/Sources/HelperKit/Protocol.swift'
      # The version-sync job also pins the embedded Uninstaller's version.
      - 'helper-uninstaller/**'
      # helper/test_claude_usage_probe.py compares the helper's Claude /usage
      # probe settings against this file; an app-side change must run it.
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/Collectors/Claude/ClaudeCLIPTYStrategy.swift'
      - '.github/workflows/helper-ci.yml'
  pull_request:
    paths:
      - 'helper/**'
      - 'scripts/check_helper_version_sync.sh'
      - 'scripts/check_helper_method_parity.sh'
      - 'HelperSwift/Sources/HelperKit/Protocol.swift'
      # The version-sync job also pins the embedded Uninstaller's version.
      - 'helper-uninstaller/**'
      # helper/test_claude_usage_probe.py compares the helper's Claude /usage
      # probe settings against this file; an app-side change must run it.
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/Collectors/Claude/ClaudeCLIPTYStrategy.swift'
      - '.github/workflows/helper-ci.yml'
  # v1.26 C2: manual retrigger trigger so a future Actions outage
  # can be unstuck without an empty-commit push.
  workflow_dispatch: {}

concurrency:
  group: helper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-sync:
    name: Helper parity (version sync + method parity)
    # Duplicated from swift-ci's check-helper-guards ON PURPOSE: a Python-only
    # HELPER_VERSION bump touches helper/** which does NOT trigger swift-ci,
    # so without this job the exact 1.23.0->1.29.1 drift the guard exists to
    # prevent would land unchecked again (codex review on the guard's own PR).
    #
    # v1.44 adds the method-parity gate here for exactly the same reason, and it
    # needed saying twice: the gate shipped wired only into swift-ci, whose paths
    # filter excludes helper/**. Adding a verb to SUPPORTED_METHODS is a
    # helper/**-only change — the normal shape of the drift — so the gate could
    # not fire in the one case it exists for. Self-review caught it before merge.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - run: bash scripts/check_helper_version_sync.sh
      - run: bash scripts/check_helper_method_parity.sh

  test:
    runs-on: ubuntu-latest
    # v1.21 G4: cap CI minutes. Pytest PTY subprocess tests can hang on a
    # mis-configured runner (see feedback_pytest_hang_stale memory).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: helper

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dev tooling
        run: python -m pip install --upgrade pip && python -m pip install pytest cryptography

      # Ruff used to run here, and that was the bug. This job has
      # `working-directory: helper`, so `ruff check .` only ever linted
      # `helper/` — and this workflow's `paths:` filter meant a change to
      # `scripts/*.py` did not start it at all. Python outside `helper/` was
      # unlinted for the life of the repo (91 errors when first measured,
      # 2026-08-17).
      #
      # Linting now lives in `.github/workflows/python-lint.yml`, which runs
      # `ruff check .` from the REPO ROOT on every `**/*.py` change — a strict
      # superset of what this step covered, so removing it leaves no gap in
      # helper/ coverage. Do not re-add a ruff step here: two pinned ruff
      # versions in two workflows is the copied-constant drift this repo has
      # been bitten by before. The pin and its rationale live in python-lint.yml.

      - name: Pytest
        run: pytest -q

      - name: Upload pytest junit on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-test-output
          path: helper/.pytest_cache/
          if-no-files-found: ignore

  app-group-copy-macos:
    name: Companion reads the app's copy through cfprefsd (macOS)
    # On a Mac the Companion reads what the app tells it (the local-scan answer,
    # the account, Settings › Privacy's switches) through cfprefsd
    # (`app_group_prefs`), and the plist file only when cfprefsd has nothing.
    # The job above runs on Linux, where that reader is off and its tests skip,
    # so the path every Mac takes ran in no CI at all. This runs the tests of
    # that copy on macOS, and fails if any of them is skipped here: a skipped
    # test passes silently, which is how the gap stayed open.
    # `test_app_group_prefs.py` compiles a few lines of Swift that write the
    # way the app does, from another process, with the runner's swiftc.
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: helper
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dev tooling
        run: python -m pip install --upgrade pip && python -m pip install pytest cryptography

      - name: Pytest (the app's copy, through cfprefsd and the file)
        run: |
          set -o pipefail
          pytest -q -rs test_local_scan_consent.py test_privacy_switches.py test_app_group_prefs.py | tee pytest.out
          if grep -q '^SKIPPED' pytest.out; then
            echo "::error::a test of the app's copy was skipped on macOS, so it did not run"
            exit 1
          fi
