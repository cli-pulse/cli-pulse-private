name: Supabase CI

on:
  push:
    paths:
      - 'backend/supabase/**'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/APIClient.swift'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/HelperAPIClient.swift'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/AlertGenerator.swift'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/Models.swift'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/DemoDataProvider.swift'
      - 'helper/**'
      - 'android/app/src/main/java/com/clipulse/android/data/remote/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    paths:
      - 'backend/supabase/**'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/APIClient.swift'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/HelperAPIClient.swift'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/AlertGenerator.swift'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/Models.swift'
      - 'CLI Pulse Bar/CLIPulseCore/Sources/CLIPulseCore/DemoDataProvider.swift'
      - 'helper/**'
      - 'android/app/src/main/java/com/clipulse/android/data/remote/**'
      - '.github/workflows/supabase-ci.yml'
  # v1.26 C2: manual retrigger trigger so a future Actions outage
  # can be unstuck without an empty-commit push.
  workflow_dispatch: {}

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search-path-guard:
    name: SECURITY DEFINER search_path regression guard (P0-3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check every public SECURITY DEFINER function pins search_path
        run: python3 backend/supabase/ci_check_search_path.py

  rpc-contract:
    name: RPC contract drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Static RPC contract check
        run: python3 backend/supabase/ci_check_rpc_contract.py

  date-windows:
    name: Rolling-window off-by-one guard (P0-2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Static rolling-window inclusive-N check
        run: python3 backend/supabase/ci_check_date_windows.py

  alert-types:
    name: Webhook TYPE_ALIASES drift guard (iter2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Static alert-type coverage check
        run: python3 backend/supabase/ci_check_alert_types.py

  user-id-cascade:
    name: GDPR right-to-erasure cascade guard (iter2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Every public table with user_id cascades to auth.users
        run: python3 backend/supabase/ci_check_user_id_cascade.py

  edge-fn-deno-tests:
    # M-9 (2026-06-07 review): the edge-function deno tests
    # (send-approval-push privacy/auth, send-webhook SSRF) existed but CI
    # never ran them — they could silently rot. Run them on every change.
    name: Edge function deno tests (M-9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          # PINNED, deliberately. This was `v2.x`, which floats — so CI could
          # (and did) go red with no code change, purely because a new Deno
          # shipped stricter lib typings. A gate that fails for reasons absent
          # from the diff is a gate people learn to ignore.
          #
          # It also made local and CI disagree silently: 2.7.5 accepted a
          # `Uint8Array` fetch body that 2.9.6 rejects, so `deno check` passed
          # locally and failed in CI with nothing to explain the difference.
          #
          # Bumping this is a deliberate, reviewable act. Do it on purpose, and
          # fix whatever the newer typings surface in the same PR.
          deno-version: "2.9.6"

      # So a future version mismatch is diagnosable from the log alone.
      - name: Report Deno version
        run: deno --version

      - name: Run edge-function deno tests
        run: deno test backend/supabase/functions/

      # v1.52.1 — type-check the ENTRYPOINTS, not just what tests import.
      #
      # `deno test` only type-checks modules reachable from a test file.
      # `receipt_test.ts` imports `./receipt.ts` and never `./index.ts`, so
      # index.ts had NEVER been type-checked by anything — in CI or locally.
      #
      # That is precisely how the receipt outage survived three months and
      # eight deploys: the root certificates were passed as `ArrayBuffer`,
      # `deno check` reports it as
      #   TS2345: Argument of type 'ArrayBuffer[]' is not assignable to
      #           parameter of type 'Buffer<ArrayBufferLike>[]'
      # and nothing was running `deno check`. Every Apple receipt 500'd before
      # any database write, and zero purchases were recorded.
      #
      # Verified 2026-08-28 that this step FAILS when `.buffer` is restored and
      # PASSES on the fixed tree — a gate nobody has watched fail is not known
      # to work.
      - name: Type-check edge function entrypoints
        run: |
          set -euo pipefail
          # Every function's entrypoint, including ones no test imports.
          find backend/supabase/functions -name 'index.ts' -print0 \
            | xargs -0 -n1 deno check

  rls-cross-user:
    # C-3 (DEV_PLAN 2026-06-27 PR3): cross-user RLS denial tests. Decoupled from
    # the schema.sql double-apply blocker below — instead of replaying
    # schema.sql onto a Supabase snapshot, we seed a BRAND-NEW Postgres from the
    # repo schema (00_supabase_shim → schema.sql → remote-table DDL → fixtures)
    # and assert, as a non-superuser `authenticated` role, that user-B cannot
    # SELECT/INSERT/UPDATE user-A rows on remote_sessions, remote_session_commands,
    # remote_session_events, remote_permission_requests, remote_permission_decisions,
    # subscriptions, daily_usage_metrics — and that a team_members ADMIN cannot
    # self-promote to owner (NEW-H2v / migrate_v0.59). psql -v ON_ERROR_STOP=1
    # makes any cross-user success fail the job.
    name: Cross-user RLS denial tests (C-3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Create a fresh database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'drop database if exists rlstest;' -c 'create database rlstest;'

      - name: Run cross-user RLS denial suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rlstest
        run: bash backend/supabase/tests/rls/run_rls_tests.sh

  provider-accounts-v072:
    # Provider-account behavior must remain equivalent for an existing
    # installation upgraded from the exact pre-v0.72 main baseline and a new
    # installation seeded from the canonical schema/RPC files. Both paths also
    # run the two-connection delete/freshness/independent-clock race suite.
    name: Provider accounts upgrade + fresh contracts (v0.72)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # The runner extracts the exact pre-v0.72 baseline by commit.
          fetch-depth: 0

      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Create isolated upgrade and fresh databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database v072_upgrade;' \
            -c 'create database v072_fresh;'

      - name: Run provider-account install-path contracts
        env:
          UPGRADE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/v072_upgrade
          FRESH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/v072_fresh
        run: bash backend/supabase/tests/run_v072_provider_accounts_tests.sh

  anonymous-telemetry-v073:
    # record_anonymous_install is the ONLY RPC in this schema an
    # unauthenticated caller can reach, so its lockdown is checked on every
    # push rather than owner-run. The companion .test.sql is pgTAP against a
    # branch database, which in practice runs approximately never.
    name: Anonymous install telemetry lockdown (v0.73)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Create isolated database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database v073_telemetry;'

      - name: Verify lockdown, validation and write-once
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/v073_telemetry
        run: bash backend/supabase/tests/run_v073_anonymous_telemetry_tests.sh

  activation-funnel-v076:
    # v0.76 DROPS and recreates `record_anonymous_install` to add three
    # parameters — `create or replace` cannot add parameters, it leaves a second
    # overload and every call becomes ambiguous. Two more ways to get this
    # wrong, both silent: grants do not survive a drop, and a shipped 1.52
    # binary sends five keys and must keep binding.
    #
    # Every one of those failures looks like "no rows arriving", which is
    # indistinguishable from "nobody installed the app" — the exact confusion
    # this telemetry exists to end. So the job replays the real upgrade
    # (v0.73 → v0.76) against a row written by the OLD signature, rather than
    # seeding the end state.
    name: Activation funnel upgrade path (v0.76)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Create isolated database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database v076_funnel;'

      - name: Verify upgrade path, back-compat and write-once
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/v076_funnel
        run: bash backend/supabase/tests/run_v076_activation_funnel_tests.sh

  revoke-grants-v077:
    # v0.77 takes the blanket table grants off anon/authenticated. The claim
    # worth testing is not "the grants went away" — it is that removing them
    # closes the TRUNCATE hole (Postgres does not apply RLS to TRUNCATE) while
    # LEAVING the live machine-control path working. A revoke broad enough to
    # close the hole is also broad enough to break the feature; only
    # SECURITY DEFINER keeps the second from following from the first, so both
    # are asserted in the same run.
    name: Remote table grant revoke (v0.77)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Create isolated database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database v077_grants;'

      - name: Verify the hole closes and the live path survives
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/v077_grants
        run: bash backend/supabase/tests/run_v077_revoke_grants_tests.sh

  # v1.21 F9 (still DEFERRED): a FULL `schema.sql → migrate_v0.X.sql` replay
  # against a fresh `supabase start` Postgres double-applies anything already in
  # the schema.sql snapshot (first surfaced at migrate_v0.9.sql CREATE POLICY →
  # "policy already exists"). The cross-user RLS coverage that blocker was
  # holding up is now delivered by the `rls-cross-user` job above (fresh-seed,
  # no replay). A clean end-to-end replay still needs either (a) a "schema.sql is
  # anchored at vN" annotation so the replay skips migrations <=vN, or (b)
  # migrations as the sole source-of-truth with schema.sql auto-generated.
