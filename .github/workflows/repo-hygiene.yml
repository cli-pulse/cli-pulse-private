name: Repo Hygiene

# The repo-wide guards, on EVERY pull request, with no path filter.
#
# WHY THIS EXISTS
# ---------------
# These guards used to live only inside the "Helper guards" job in swift-ci.yml,
# which is path-filtered to 'CLI Pulse Bar/**', 'HelperSwift/**' and a handful of
# named scripts. So a pull request that touched nothing but documentation ran
# NONE of them — and CI Gate correctly reported green, because a workflow that
# never ran is N/A by design.
#
# That is precisely backwards for `check_no_internal_docs.sh`. The PR most likely
# to add an internal engineering document to this PUBLIC repository is a
# docs-only PR, and that is exactly the PR on which the guard did not run.
#
# It nearly cost us on 2026-08-07: a careless `git add -A` pushed 176 unintended
# files, 141 of them internal documents. The guard caught it — but only because
# the same commit happened to sweep in some `.swift` files and therefore matched
# swift-ci's path filter. Had it been the documents alone, nothing would have run.
#
# Duplicating these invocations with swift-ci.yml is deliberate and safe: both
# call the SAME scripts, so the scripts remain the single source of truth and
# there is nothing to drift. The cost is a few seconds of grep.
#
# This workflow is in CI Gate's GATES list. Because it has no path filter it
# always runs, so it is never N/A and can never silently pass by absence.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo-wide guards (internal docs + copyright + migrations + legal URLs)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # The repo is named `cli-pulse-private` and is PUBLIC. This is the guard
      # that keeps internal engineering documents out of it.
      - run: bash scripts/check_no_internal_docs.sh

      # One number, one migration, forever. Also path-blind here: a PR touching
      # only backend/supabase/ does not match swift-ci's filter either.
      - run: bash scripts/check_migration_numbers.sh

      # SwiftPM globs Sources/ and Tests/, so a stray "Foo 2.swift" next to
      # "Foo.swift" is compiled and makes the type ambiguous. It killed an iOS
      # archive on 2026-08-11 after ~20 minutes, with 25 such files present.
      # .gitignore already matches them — which is exactly why a separate guard
      # is needed: ignoring protects the index, not the compiler.
      - run: bash scripts/check_no_duplicate_sources.sh

      - run: bash scripts/check_copyright.sh

      # `privacy.localOnlyMode` overrides the telemetry switch inside the store,
      # so any surface rendering that switch must disclose it. Both surfaces are
      # SwiftUI views in the app target, which has no test bundle.
      - run: bash scripts/check_telemetry_switch_discloses_suppression.sh

      # .gitignore does not apply to files git already tracks, so an ignore rule
      # becomes decorative the moment something slips past it — and stays that
      # way silently. `CLI Pulse Bar/codexbar/` had been ignored for months
      # while one 798-line file from steipete/CodexBar sat tracked inside it,
      # committed by an unrelated PR, in a PUBLIC repo.
      #
      # Path-blind on purpose, same reasoning as the docs guard above: the PR
      # most likely to sweep in a stray vendored file is the one that has
      # nothing to do with vendoring.
      - run: bash scripts/check_no_tracked_ignored_files.sh

      # The app's Privacy Policy / Terms links, which App Review clicks under
      # Guideline 3.1.2. Needs network; they broke silently for twelve days once.
      - run: bash scripts/check_legal_urls.sh

      # The paywall sold five features that did not exist and four limits that
      # nothing enforced, for months, because a feature bullet is a string and a
      # string compiles either way. This makes each bullet name the code that
      # withholds it. Path-blind for the usual reason: the PR most likely to add
      # a bullet is a localization or copy PR that touches no Swift at all.
      - run: bash scripts/check_paywall_claims.sh

      # And its negative control — the guard above is only evidence if it has
      # been watched to fail. This mutates a throwaway copy five ways and
      # asserts a rejection each time, plus a positive control.
      - run: bash scripts/test_check_paywall_claims.sh

      # App Store release notes may not describe third-party platforms —
      # Guideline 2.3.10. macOS 1.52.0 (build 104) was REJECTED on 2026-08-28
      # for a bullet reading "Removed on Android: the option to subscribe."
      #
      # The identical text PASSED review on iOS the same week, so "it got
      # approved last time" is not evidence of compliance — hence a mechanical
      # check rather than a habit.
      - run: bash scripts/check_release_notes_platforms.sh
      - run: bash scripts/test_check_release_notes_platforms.sh

      # Apple `.lproj` parity. Android has had this guard since v1.21; the
      # Apple catalogues never got one and drifted to 670 untranslated keys
      # across four shipped locales — es and ko carried 3 of the 80 first-run
      # wizard keys — every one of which rendered as its raw dotted identifier
      # until `L10n.resolve` gained an English fallback.
      #
      # A ratchet rather than a bar: the 670 are baselined, NEW drift fails.
      # A permanently-red gate gets `continue-on-error`'d, which is the same
      # failure as a green gate that guards nothing.
      #
      # Path-blind for the usual reason: the PR most likely to add an
      # en-only key is a Swift PR that touches no `.strings` file at all.
      - run: python3 scripts/check_apple_strings_parity.py
      - run: bash scripts/test_check_apple_strings_parity.sh
